name: Bug report
description: Report something that is not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please remove any personal
        email content from logs and screenshots before posting. For security
        issues, do not use this form; see the Security policy instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Open the sheet
        2. Click Trackex, then Start tracking
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Execution log output
      description: Paste relevant output from Apps Script's Executions view. Remove personal email content first.
      render: shell
    validations:
      required: false
  - type: dropdown
    id: mode
    attributes:
      label: Extraction mode
      description: Which mode were you using?
      options:
        - Claude extraction
        - Keyword heuristics
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Trackex version
      description: The version you are running.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal email content from logs
          required: true
