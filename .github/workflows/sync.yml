name: Sync inboxes

# Vercel's free plan only allows daily cron jobs, so GitHub Actions triggers the sync
# every 15 minutes (free for public repos). Needs two repository secrets:
#   APP_URL      e.g. https://trackex.vercel.app
#   CRON_SECRET  the same value as the CRON_SECRET environment variable on Vercel
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Trigger /api/cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_URL / CRON_SECRET secrets not set — skipping (see docs/SETUP.md)."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 320 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron"
