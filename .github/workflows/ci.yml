name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test & bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run bundle
      - name: Syntax-check the bundle
        run: node --check - < dist/Code.gs
      - uses: actions/upload-artifact@v4
        with:
          name: trackex-bundle
          path: dist/
